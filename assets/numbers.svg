<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img" aria-labelledby="t d">
<title id="t">By the numbers</title>
<desc id="d">npm installs a month, GitHub stars, followers and public repositories.</desc>
<style>.s{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.fb{transform-box:fill-box;transform-origin:center}.fl{transform-box:fill-box;transform-origin:0 50%}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes a1{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.a1{animation:a1 .7s cubic-bezier(.22,1,.36,1) 0.2s both}@keyframes a2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.a2{animation:a2 .7s cubic-bezier(.22,1,.36,1) 0.32s both}@keyframes a3{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.a3{animation:a3 .7s cubic-bezier(.22,1,.36,1) 0.44s both}@keyframes a4{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.a4{animation:a4 .7s cubic-bezier(.22,1,.36,1) 0.56s both}</style>
<defs><radialGradient id="glow" cx="420" cy="0" r="480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5ab0ff" stop-opacity=".16"/><stop offset="1" stop-color="#5ab0ff" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="839" height="159" rx="14" fill="#0b0d12" stroke="#262b36"/>
<rect x=".5" y=".5" width="839" height="159" rx="14" fill="url(#glow)"/>
<g class="a1"><text class="m" x="28" y="40" font-size="11" fill="#7c8596">NPM INSTALLS / MONTH</text><text class="m" x="28" y="88" font-size="40" font-weight="700" fill="#a98bff">1.2k</text><text class="s" x="28" y="116" font-size="12.5" fill="#a9b1c0">last 30 days, all my packages</text></g><g class="a2"><line x1="214" y1="30" x2="214" y2="130" stroke="#262b36"/><text class="m" x="230" y="40" font-size="11" fill="#7c8596">GITHUB STARS</text><text class="m" x="230" y="88" font-size="40" font-weight="700" fill="#ffb545">11</text><text class="s" x="230" y="116" font-size="12.5" fill="#a9b1c0">on the repos below</text></g><g class="a3"><line x1="416" y1="30" x2="416" y2="130" stroke="#262b36"/><text class="m" x="432" y="40" font-size="11" fill="#7c8596">NPM PACKAGES</text><text class="m" x="432" y="88" font-size="40" font-weight="700" fill="#5ab0ff">5</text><text class="s" x="432" y="116" font-size="12.5" fill="#a9b1c0">published on the registry</text></g><g class="a4"><line x1="618" y1="30" x2="618" y2="130" stroke="#262b36"/><text class="m" x="634" y="40" font-size="11" fill="#7c8596">PUBLIC REPOS</text><text class="m" x="634" y="88" font-size="40" font-weight="700" fill="#5be49b">63</text><text class="s" x="634" y="116" font-size="12.5" fill="#a9b1c0">and a few private ones</text></g>
</svg>