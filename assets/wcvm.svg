<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-labelledby="t d">
<title id="t">wcvm: Node.js in your browser tab. Web Workers, npm install and dev servers like Vite, Next.js and Express, with no backend.</title>
<desc id="d">Architecture: host page, kernel worker, process workers, file system worker, and a service worker relaying dev servers to a preview iframe.</desc>
